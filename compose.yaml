services:
  workspace:
    build: .
    restart: unless-stopped
    init: true
    environment:
      ARK_PUBLIC_ORIGIN: https://${ARK_DOMAIN:?Set ARK_DOMAIN in .env}
      ARK_PASSWORD_HASH_FILE: /run/secrets/workspace_password
    secrets:
      - workspace_password
    volumes:
      - workspace_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ARK_DOMAIN: ${ARK_DOMAIN:?Set ARK_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      workspace:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  workspace_password:
    file: ./deploy/password.hash

volumes:
  workspace_data:
  caddy_data:
  caddy_config:
